# Render Blueprint — Aide always-on Node (Next.js + Socket.IO) + BullMQ/Chromium worker.
# Region singapore sits next to Neon ap-southeast-1.
# Secrets: sync:false — set via Render dashboard/CLI from local env. Never commit values.
# Redis: reuse existing Upstash (REDIS_URL / REALTIME_REDIS_URL). No Render Key Value required.
# Docs: docs/deploy/RENDER.md

envVarGroups:
  - name: aide-shared
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: ACTIONS_CREDENTIALS_KEY
        sync: false
      - key: ACTIONS_IDENTITY_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: REDIS_ENABLED
        value: "1"
      - key: BULLMQ_ENABLED
        value: "1"
      - key: REDIS_URL
        sync: false
      - key: REALTIME_REDIS_URL
        sync: false
      - key: REALTIME_TOKEN_SECRET
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SAFEPAY_API_KEY
        sync: false
      - key: SAFEPAY_V1_SECRET
        sync: false
      - key: SAFEPAY_WEBHOOK_SECRET
        sync: false
      - key: SAFEPAY_ENVIRONMENT
        sync: false
      - key: GITHUB_MCP_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_MCP_OAUTH_CLIENT_SECRET
        sync: false

services:
  - type: web
    name: aide-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: sh scripts/render-entrypoint.sh
    region: singapore
    plan: standard
    preDeployCommand: npx prisma migrate deploy
    healthCheckPath: /api/health
    envVars:
      - fromGroup: aide-shared
      - key: SERVICE_ROLE
        value: "web"
      - key: PG_POOL_MAX
        value: "10"
      - key: PG_POOL_IDLE_MS
        value: "300000"
      - key: AUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: REALTIME_ALLOWED_ORIGINS
        sync: false
      - key: REALTIME_ENABLED
        value: "1"
      - key: CRAWL_BROWSER_ENABLED
        value: "0"
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false

  # BullMQ + recrawl sweep + Playwright Chromium + realtime outbox publisher (child).
  - type: worker
    name: aide-jobs
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: sh scripts/render-entrypoint.sh
    region: singapore
    plan: standard
    envVars:
      - fromGroup: aide-shared
      - key: SERVICE_ROLE
        value: "jobs"
      - key: REALTIME_ENABLED
        value: "1"
      - key: CRAWL_BROWSER_ENABLED
        value: "1"
      - key: WORKER_CONCURRENCY_CRAWL
        value: "1"
