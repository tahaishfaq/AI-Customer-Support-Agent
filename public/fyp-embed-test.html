<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brandly FYP — AIDE Embed Test (local)</title>
  <style>
    :root { --ink:#0f172a; --muted:#64748b; --bg:#f8fafc; --brand:#0ea5e9; }
    body { margin:0; font-family: ui-sans-serif, system-ui, sans-serif; color:var(--ink); background:var(--bg); }
    header { padding:1.25rem 1.5rem; background:#fff; border-bottom:1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center; }
    .logo { font-weight:800; } .logo span { color:var(--brand); }
    main { max-width: 920px; margin: 0 auto; padding: 2.5rem 1.5rem 8rem; }
    h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); line-height:1.1; margin:0 0 .75rem; }
    p { color:var(--muted); font-size:1.05rem; line-height:1.55; }
    .card { margin-top:2rem; padding:1.25rem; background:#fff; border:1px solid #e2e8f0; border-radius:12px; }
    .badge { font-size:.75rem; font-weight:600; color:#0369a1; background:#e0f2fe; padding:.2rem .5rem; border-radius:999px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">Brand<span>ly</span> <small style="font-weight:500;color:var(--muted)">FYP + AIDE embed</small></div>
    <div class="badge">LOCAL TEST HOST</div>
  </header>
  <main>
    <h1>AI brand–influencer support, on your site.</h1>
    <p>Simulated Brandly FYP page with AIDE widget. Agent: <strong>AI Assist</strong></p>
    <div class="card"><p style="margin:0">Open the chat bubble and run the golden checklist.</p></div>
  </main>
<!-- AIDE webchat -->
<script
  src="http://localhost:3000/embed.js?v=11"
  data-aide-key="74HMeW6ucjrJrm2bo4bKFNKd"
  defer
></script>
<!--
  Signed-in visitors (ACCOUNT tools): use aideChat.setUser after login.
  Raw browser customerId alone never unlocks ACCOUNT_READ.
  Live WRITE tools always Confirm in the widget before calling your API.
  Guest lookups must return redacted data only.
  Docs: docs/features/EMBED_END_USER_IDENTITY.md
-->
<!-- After your site login (every page load while signed in) -->
<script>
  window.aideChat && aideChat.setUser({
    subject: "user_123",
    displayName: "Alex",
    accessToken: "MERCHANT_SESSION_OR_API_TOKEN"
  });
  aideChat.onAuthRefreshNeeded = async function () {
    const accessToken = await fetchFreshAccessToken(); // your app
    aideChat.setUser({ subject: "user_123", displayName: "Alex", accessToken });
  };
</script>
</body>
</html>
